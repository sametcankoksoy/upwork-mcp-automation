name: Render 24/7 Keep-Alive & Snapshot Poll

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health & Poll Upwork Snapshots
        run: |
          curl -sS https://upwork-mcp-automation.onrender.com/health
          curl -sS -X POST https://upwork-mcp-automation.onrender.com/api/poll
